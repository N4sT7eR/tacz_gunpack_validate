[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tacz-gunpack-validator"
version = "0.9.1"
description = "Validates a TaCZ (Timeless and Classics Zero) gunpack without launching Minecraft"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "N4sT7eR" }]
keywords = ["minecraft", "tacz", "gunpack", "validator", "linter"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Games/Entertainment",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = []

[project.optional-dependencies]
gui = ["PySide6>=6.5"]
dev = ["pytest>=7", "pyinstaller>=6"]

[project.scripts]
tacz-validate = "tacz_validator.cli:main"

[project.gui-scripts]
tacz-validate-gui = "tacz_validator.gui:main"

[project.urls]
Homepage = "https://github.com/N4sT7eR/tacz_gunpack_validate"
Issues = "https://github.com/N4sT7eR/tacz_gunpack_validate/issues"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
tacz_validator = ["rules/*.json", "locales/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
