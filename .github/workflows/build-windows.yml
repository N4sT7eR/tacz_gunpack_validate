name: Build Windows EXE

on:
  push:
    # Tags produce a release; branch pushes produce a downloadable artifact so
    # the GUI can be tried on Windows without cutting a release.
    branches: [main, develop]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[gui]" pyinstaller

      - name: Test before packaging
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m unittest discover -s tests -t .

      - name: Build the GUI executable
        run: >
          pyinstaller --onefile --windowed --name TaCZValidator
          --add-data "src/tacz_validator/rules;tacz_validator/rules"
          --add-data "src/tacz_validator/locales;tacz_validator/locales"
          src/tacz_validator/gui/__main__.py

      - name: Build the CLI executable
        run: >
          pyinstaller --onefile --name TaCZValidator-cli
          --add-data "src/tacz_validator/rules;tacz_validator/rules"
          --add-data "src/tacz_validator/locales;tacz_validator/locales"
          src/tacz_validator/cli/__main__.py

      - name: Smoke-test the executables
        run: |
          dist/TaCZValidator-cli.exe tests/data/valid_pack --no-progress
          dist/TaCZValidator-cli.exe tests/data/broken_pack --lang ja --severity error --no-progress; if ($LASTEXITCODE -ne 1) { throw "expected exit code 1 for a broken pack" }

      - uses: actions/upload-artifact@v4
        with:
          name: TaCZValidator
          path: dist/*.exe
          if-no-files-found: error

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.exe
