name: Build Windows EXE

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[gui]" pyinstaller

      - name: Test before packaging
        run: python -m unittest discover -s tests -t .

      - name: Build the CLI executable
        run: >
          pyinstaller --onefile --name TaCZValidator-cli
          --add-data "src/tacz_validator/rules;tacz_validator/rules"
          --add-data "src/tacz_validator/locales;tacz_validator/locales"
          src/tacz_validator/cli/__main__.py

      - name: Smoke-test the executable
        run: dist/TaCZValidator-cli.exe tests/data/valid_pack --no-progress

      - uses: actions/upload-artifact@v4
        with:
          name: TaCZValidator
          path: dist/*.exe
          if-no-files-found: error

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.exe
