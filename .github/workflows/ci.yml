name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.8 is what the maintainer's machine runs; 3.12 is what the EXE ships with.
        python-version: ["3.8", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          # The GUI tests skip themselves when Qt is unavailable; install it where we can.
          python -m pip install PySide6 || echo "PySide6 unavailable for this Python; GUI tests will skip"
      # main ships without the test suite, so these steps are skipped there;
      # develop is where the gate actually runs.
      - name: Run tests
        if: hashFiles('tests/**') != ''
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m unittest discover -s tests -t . -v
      - name: Validate the fixture packs through the CLI
        if: hashFiles('tests/**') != ''
        run: |
          python -m tacz_validator.cli tests/data/valid_pack --no-progress
          python -m tacz_validator.cli tests/data/broken_pack --format json -o findings.json --no-progress || true
          cat findings.json
